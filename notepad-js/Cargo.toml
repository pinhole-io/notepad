[package]
name = "notepad_js"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Node.js bindings for notepad (napi-rs)"

[features]
default = ["synthesize"]
synthesize = ["notepad/synthesize", "notepad/superglue"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
    "napi9",
    "async",
    "serde-json",
    "tokio_rt",
] }
napi-derive = "3"
notepad = { path = "..", features = ["synthesize", "superglue"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = "1"
superglue = { path = "../../superglue" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "2"
