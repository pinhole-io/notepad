[package]
name = "notepad_py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for notepad (session working memory)"

[features]
default = ["synthesize"]
synthesize = ["notepad/synthesize", "notepad/superglue"]

[lib]
name = "notepad_py"
crate-type = ["cdylib"]

build = "build.rs"

[dependencies]
notepad = { path = "..", features = ["synthesize", "superglue"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
uuid = "1"
superglue = { path = "../../superglue" }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
