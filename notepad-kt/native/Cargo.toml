[package]
name = "notepad_kt"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Android JNI bindings for notepad (Kotlin)"
publish = false

[features]
default = ["synthesize"]
synthesize = ["notepad/synthesize", "notepad/superglue"]

[lib]
name = "notepad_kt"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22"
notepad = { path = "../..", features = ["synthesize", "superglue"] }
notepad-bridge = { path = "../../notepad-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = "1"
superglue = { path = "../../../superglue" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
